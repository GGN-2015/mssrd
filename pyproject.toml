[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mssrd"
version = "0.1.0"
description = "Training-free multiscale spectral bottleneck prediction for image autoencoders"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "GGN_2015"}]
keywords = ["autoencoder", "bottleneck", "PCA", "rate-distortion", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8",
  "medmnist>=3.0.2",
  "numpy>=1.26",
  "pillow>=10.0",
  "torch>=2.5",
  "torchvision>=0.20",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
mssrd = "mssrd.cli:main"

[project.urls]
Homepage = "https://github.com/GGN-2015/mssrd"
Repository = "https://github.com/GGN-2015/mssrd"
Issues = "https://github.com/GGN-2015/mssrd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mssrd"]

[tool.hatch.build.targets.sdist]
include = ["src/mssrd", "tests", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
